<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
<title>B2B Request Form - NNA VITTALO</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;background:#f5f7fc;color:#1a1f36;line-height:1.6}
html{scroll-behavior:smooth}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#f5f7fc}
::-webkit-scrollbar-thumb{background:#c0ccee;border-radius:3px}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}

/* NAV */
.nav{background:#fff;border-bottom:3px solid #2952c8;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(41,82,200,.10)}
.nav-inner{max-width:1260px;margin:0 auto;display:flex;align-items:center;padding:0 20px;height:64px}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;margin-right:auto}
.nav-logo-icon{width:40px;height:40px;background:#2952c8;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.nav-logo-text{font-family:'Montserrat',sans-serif;font-weight:900;font-size:1.05rem;color:#0f2266;letter-spacing:1.5px;line-height:1}

.btn-solid{font-family:'Montserrat',sans-serif;font-weight:700;font-size:.8rem;background:#2952c8;color:#fff;padding:9px 18px;border-radius:6px;border:none;white-space:nowrap;display:inline-block;text-align:center;}
.btn-solid:hover{background:#1e3d99}
.btn-block{width:100%;padding:12px;font-size:1rem}

.container{max-width:800px;margin:40px auto;padding:0 20px;}
.form-card{background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.05);margin-bottom:40px;}
.form-card h2{font-family:'Montserrat',sans-serif;font-weight:800;color:#0f2266;margin-bottom:20px;font-size:1.5rem;text-align:center;}

.form-group{margin-bottom:20px;}
.form-group label{display:block;font-weight:600;margin-bottom:8px;color:#2d3748;font-size:0.9rem;}
.form-input, .form-select, .form-textarea{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:8px;font-family:inherit;font-size:0.95rem;transition:all 0.3s ease;background:#f8fafc;}
.form-input:focus, .form-select:focus, .form-textarea:focus{outline:none;border-color:#2952c8;box-shadow:0 0 0 3px rgba(41,82,200,0.1);background:#fff;}
.form-textarea{resize:vertical;min-height:100px;}

.slider-container{display:flex;align-items:center;gap:15px;}
.slider-container input[type=range]{flex-grow:1;}
.slider-value{font-weight:700;color:#2952c8;min-width:100px;text-align:right;}

/* Multi-select specific styles (using standard select multiple for simplicity) */
select[multiple]{height:120px;}

.success-message{display:none;background:#c6f6d5;color:#22543d;padding:15px;border-radius:8px;margin-top:20px;text-align:center;font-weight:600;}
.error-message{display:none;background:#fed7d7;color:#822727;padding:15px;border-radius:8px;margin-top:20px;text-align:center;font-weight:600;}

.btn-container { text-align: center; margin: 30px 0; }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon">⛰️</div>
      <div class="nav-logo-text">NNA VITTALO</div>
    </a>
  </div>
</header>

<div class="container">
  <div class="btn-container">
    <a href="/b2b/packages/" class="btn-solid">View B2B Packages</a>
  </div>

  <div class="form-card">
    <h2>B2B Request Form</h2>
    <form id="b2bForm">

      <div class="form-group">
        <label for="countries">Countries to travel (Multiple selection)</label>
        <select id="countries" name="countries" class="form-select" multiple required>
          <option value="France">France</option>
          <option value="Italy">Italy</option>
          <option value="Spain">Spain</option>
          <option value="Switzerland">Switzerland</option>
          <option value="Germany">Germany</option>
          <option value="Greece">Greece</option>
          <option value="Turkey">Turkey</option>
          <option value="Portugal">Portugal</option>
          <option value="UK">UK</option>
          <option value="USA">USA</option>
          <option value="UAE">UAE</option>
          <option value="Maldives">Maldives</option>
          <option value="Thailand">Thailand</option>
          <option value="Japan">Japan</option>
          <option value="Australia">Australia</option>
        </select>
        <small style="color:#718096; font-size:0.8rem; margin-top:5px; display:block;">Hold Ctrl (Windows) or Command (Mac) to select multiple.</small>
      </div>

      <div class="form-group">
        <label for="budget">Budget (per person) in Euro</label>
        <div class="slider-container">
          <input type="range" id="budget" name="budget" min="0" max="10000" step="100" value="1000" oninput="document.getElementById('budgetValue').textContent = this.value + ' €'">
          <span class="slider-value" id="budgetValue">1000 €</span>
        </div>
      </div>

      <div class="form-group">
        <label for="travellers">Travellers</label>
        <input type="text" id="travellers" name="travellers" class="form-input" placeholder="e.g: 2 Adult 1 child" required>
      </div>

      <div class="form-group">
        <label for="departureAirport">Departure Airport</label>
        <input type="text" id="departureAirport" name="departureAirport" class="form-input" placeholder="e.g: London Heathrow (LHR)" required>
      </div>

      <div class="form-group">
        <label for="hotelType">Hotel Type</label>
        <select id="hotelType" name="hotelType" class="form-select" required>
          <option value="" disabled selected>Select hotel type</option>
          <option value="Hostel">Hostel</option>
          <option value="Apartment">Apartment</option>
          <option value="2 Star">2 Star</option>
          <option value="3 Star">3 Star</option>
          <option value="4 Star">4 Star</option>
          <option value="5 Star">5 Star</option>
        </select>
      </div>

      <div class="form-group">
        <label for="driverRequired">Driver</label>
        <select id="driverRequired" name="driverRequired" class="form-select" required>
          <option value="" disabled selected>Select driver requirement</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>

      <div class="form-group">
        <label for="carType">Car Type</label>
        <select id="carType" name="carType" class="form-select">
          <option value="" selected>Not required / Select car type</option>
          <option value="5 seater">5 seater</option>
          <option value="7 seater">7 seater</option>
          <option value="Caravan 4 sleeper">Caravan 4 sleeper</option>
          <option value="Caravan 5 sleeper">Caravan 5 sleeper</option>
        </select>
      </div>

      <div class="form-group">
        <label for="foodPreference">Food Preference</label>
        <select id="foodPreference" name="foodPreference" class="form-select">
          <option value="None" selected>None</option>
          <option value="Vegetarian">Vegetarian</option>
          <option value="Halal">Halal</option>
        </select>
      </div>

      <div class="form-group">
        <label for="otherRequests">Any other requests</label>
        <textarea id="otherRequests" name="otherRequests" class="form-textarea" placeholder="e.g: Need a wheelchair accessible room..."></textarea>
      </div>

      <div class="form-group">
        <label for="customerName">Name</label>
        <input type="text" id="customerName" name="customerName" class="form-input" placeholder="Your full name" required>
      </div>

      <div class="form-group">
        <label for="whatsappNo">WhatsApp No.</label>
        <input type="tel" id="whatsappNo" name="whatsappNo" class="form-input" placeholder="e.g: +1234567890" required>
      </div>

      <button type="submit" class="btn-solid btn-block" id="submitBtn">Send Request</button>

      <div id="successMsg" class="success-message">Your request has been sent successfully! We will contact you soon.</div>
      <div id="errorMsg" class="error-message">Failed to send request. Please try again.</div>
    </form>
  </div>

  <div class="btn-container">
    <a href="/b2b/packages/" class="btn-solid">View B2B Packages</a>
  </div>
</div>

<script>
  // Initialize Supabase - using the same keys as the main app
  const supabaseUrl = 'https://ghwmmkiynmnunotwnenj.supabase.co'; // 👈 Your URL
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdod21ta2l5bm1udW5vdHduZW5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NzkxMjEsImV4cCI6MjA5MDU1NTEyMX0.gC5tdWEciwZbF_1FzmD16V7JX66N7nHJ-G00C4gyG_0'; // 👈 Your Anon Key
  const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

  document.getElementById('b2bForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    document.getElementById('successMsg').style.display = 'none';
    document.getElementById('errorMsg').style.display = 'none';

    // Get selected countries
    const countriesSelect = document.getElementById('countries');
    const selectedCountries = Array.from(countriesSelect.selectedOptions).map(option => option.value);

    const formData = {
      countries: selectedCountries,
      budget_per_person: parseInt(document.getElementById('budget').value, 10),
      travellers: document.getElementById('travellers').value,
      departure_airport: document.getElementById('departureAirport').value,
      hotel_type: document.getElementById('hotelType').value,
      driver_required: document.getElementById('driverRequired').value,
      car_type: document.getElementById('carType').value || null,
      food_preference: document.getElementById('foodPreference').value || 'None',
      other_requests: document.getElementById('otherRequests').value,
      customer_name: document.getElementById('customerName').value,
      whatsapp_no: document.getElementById('whatsappNo').value
    };

    try {
      const { data, error } = await _supabase
        .from('b2b_requests')
        .insert([formData]);

      if (error) throw error;

      document.getElementById('successMsg').style.display = 'block';
      this.reset();
      document.getElementById('budgetValue').textContent = '1000 €';
    } catch (error) {
      console.error('Error inserting data:', error);
      document.getElementById('errorMsg').style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Request';
    }
  });
</script>

</body>
</html>
